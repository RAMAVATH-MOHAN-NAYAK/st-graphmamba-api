services:
  - type: web
    name: st-graphmamba-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false
